# Test settings. Override any of them on the command line, e.g.:
#   mvn test -Dbase.url=http://localhost:4173 -Dheadless=false

# Address of the running spreadsheet application (`npm run dev` serves on port 5173).
base.url=http://localhost:5173

# Browser to use: chrome, firefox or edge.
browser=chrome

# true = run without opening a visible browser window.
headless=false

# Maximum time (in seconds) an explicit wait waits for something to happen.
timeout.seconds=10
